name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag to publish under"
        type: string
        default: latest
      dry-run:
        description: "Pack only - do not publish"
        type: boolean
        default: false

# Required for npm Trusted Publishing (OIDC). No NPM_TOKEN needed.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      # Node 24 bundles npm >= 11.5.0, required for Trusted Publishing (OIDC)
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Verify scaffolder output
        run: node ./create.js "${RUNNER_TEMP}/scaffold-check"

      - name: Pack (dry run)
        if: inputs.dry-run
        run: npm pack --pack-destination "${RUNNER_TEMP}"

      - name: Publish to npm
        if: ${{ !inputs.dry-run }}
        run: npm publish --access public --tag "${{ inputs.tag }}"
